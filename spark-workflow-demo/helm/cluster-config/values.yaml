# Populated by the terraform k8s-addons module.

region: ""
route53ZoneId: ""
acmeEmail: ""

# Namespace holding the Gateway, EnvoyProxy and TLS certificate.
platformNamespace: spark-platform

# CIDRs allowed to reach the public NLB. Empty = open to the internet.
allowedCidrs: []

gateway:
  name: spark-demo
  className: envoy

clusterSecretStore:
  name: aws-secrets-manager

issuer:
  name: letsencrypt
  server: https://acme-v02.api.letsencrypt.org/directory

certificate:
  secretName: spark-demo-tls
  dnsNames: []
