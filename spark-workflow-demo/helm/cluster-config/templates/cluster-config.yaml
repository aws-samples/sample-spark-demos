# ESO: one cluster-wide store against AWS Secrets Manager (auth via the
# controller's Pod Identity role).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
# cert-manager: Let's Encrypt via DNS-01 (Route53), no HTTP ordering issues.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer.name }}
spec:
  acme:
    server: {{ .Values.issuer.server }}
    email: {{ .Values.acmeEmail }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          route53:
            region: {{ .Values.region }}
            hostedZoneID: {{ .Values.route53ZoneId }}
---
# One certificate with explicit SANs for all demo hosts, consumed by the Gateway.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spark-demo-tls
  namespace: {{ .Values.platformNamespace }}
spec:
  secretName: {{ .Values.certificate.secretName }}
  issuerRef:
    name: {{ .Values.issuer.name }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.certificate.dnsNames }}
    - {{ . }}
    {{- end }}
---
# Envoy Gateway: proxy fleet fronted by an internet-facing NLB.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nlb-proxy
  namespace: {{ .Values.platformNamespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
        {{- with .Values.allowedCidrs }}
        # Source restriction at L4: the LB controller turns this into the
        # ingress rules of the NLB's frontend security group, so it covers
        # all three demo hostnames and both listeners (:80 and :443) at
        # once. Omitted entirely when unset — that is the from-zero
        # default, so nothing breaks for someone who has not set
        # DEMO_ALLOWED_CIDRS.
        loadBalancerSourceRanges:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nlb-proxy
    namespace: {{ .Values.platformNamespace }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.platformNamespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.certificate.secretName }}
      allowedRoutes:
        namespaces:
          from: All
---
# spicedb-operator v1.23 reconciles its CRD at startup (regardless of the
# --crd flag); the upstream chart's minimal ClusterRole only allows
# discovery. A name-scoped update permission on exactly this CRD closes
# the gap without granting the operator blanket CRD permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spicedb-operator-crd-update
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [spicedbclusters.authzed.com]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spicedb-operator-crd-update
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spicedb-operator-crd-update
subjects:
  - kind: ServiceAccount
    name: spicedb-operator
    namespace: spicedb-operator
---
# Supplement to the upstream chart's namespaced Role: operator v1.23
# additionally needs PDB and EndpointSlice permissions (diffed against
# the official config/rbac/role.yaml of the operator release).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spicedb-operator-supplement
  namespace: {{ .Values.appNamespace }}
rules:
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spicedb-operator-supplement
  namespace: {{ .Values.appNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spicedb-operator-supplement
subjects:
  - kind: ServiceAccount
    name: spicedb-operator
    namespace: spicedb-operator
