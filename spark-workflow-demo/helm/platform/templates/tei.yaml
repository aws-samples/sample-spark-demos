{{- if .Values.tei.enabled }}
# Text Embeddings Inference (Hugging Face, Apache-2.0) serving BGE-M3 on CPU —
# the exact embedding model the upstream architecture documents. The model
# (~2 GB) is downloaded from the HF Hub on first start into an emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "spark-platform.selectorLabels" "tei" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "spark-platform.selectorLabels" "tei" | nindent 8 }}
    spec:
      containers:
        - name: tei
          image: {{ .Values.tei.image }}
          args:
            - --model-id={{ .Values.tei.modelId }}
            # Pinned Hub revision: the model is fetched at pod start, so a
            # floating `main` would silently change what the demo embeds with.
            - --revision={{ .Values.tei.revision }}
            - --port=8080
            # BGE-M3 (8192 seq len) warmup allocates for the full max batch:
            # the 16384-token default OOMs CPU pods — cap it demo-appropriately.
            - --max-batch-tokens={{ .Values.tei.maxBatchTokens }}
            # Requests per call the router accepts (default 32): the
            # suche-und-zuordnung module embeds its research passages in
            # batches of 40 ("batch size 40 > maximum allowed batch size 32",
            # observed 2026-10-20, the findings workflow failed on it).
            - --max-client-batch-size={{ .Values.tei.maxClientBatchSize }}
            - --auto-truncate
          env:
            - name: HF_HOME
              value: /data
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          volumeMounts:
            - { name: data, mountPath: /data }
          resources: {{- toYaml .Values.tei.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tei
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  selector: {{- include "spark-platform.selectorLabels" "tei" | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
