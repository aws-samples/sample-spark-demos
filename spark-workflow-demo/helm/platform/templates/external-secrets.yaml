# ExternalSecrets: sync AWS Secrets Manager entries (created by terraform)
# into Kubernetes Secrets. Hooked copies for the init jobs carry hook
# annotations so they exist before pre-install jobs run.
{{- $store := .Values.clusterSecretStore }}
---
# RDS master credentials — needed by the db-init pre-install job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: rds-master }
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secretsManager.rdsMaster }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secretsManager.rdsMaster }}, property: password }
---
# S3 app credentials — db-init job downloads the seed with them; app services
# use them for document storage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-app
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: s3-app }
  data:
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: {{ .Values.secretsManager.s3App }}, property: access_key_id }
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: {{ .Values.secretsManager.s3App }}, property: secret_access_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: keycloak-db }
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.secretsManager.rdsKeycloak }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.secretsManager.rdsKeycloak }}, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-credentials
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: keycloak-credentials }
  data:
    - secretKey: admin_password
      remoteRef: { key: {{ .Values.secretsManager.keycloak }}, property: admin_password }
    - secretKey: client_secret
      remoteRef: { key: {{ .Values.secretsManager.keycloak }}, property: client_secret }
    - secretKey: demo_user_email
      remoteRef: { key: {{ .Values.secretsManager.keycloak }}, property: demo_user_email }
    - secretKey: demo_user_password
      remoteRef: { key: {{ .Values.secretsManager.keycloak }}, property: demo_user_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: oauth2-proxy }
  data:
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: cookie-secret
      remoteRef: { key: {{ .Values.secretsManager.oauth2Proxy }}, property: cookie_secret }
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: client-secret
      remoteRef: { key: {{ .Values.secretsManager.keycloak }}, property: client_secret }
{{- if .Values.keycloak.externalOidc.enabled }}
---
# Client credentials of the external OIDC provider (operator's SSO), read by
# the keycloak-bootstrap job to register the identity provider in the realm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-oidc-credentials
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: external-oidc-credentials }
  data:
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: client_id
      remoteRef: { key: {{ .Values.secretsManager.externalOidc }}, property: client_id }
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: client_secret
      remoteRef: { key: {{ .Values.secretsManager.externalOidc }}, property: client_secret }
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: litellm }
  data:
    - secretKey: master_key
      remoteRef: { key: {{ .Values.secretsManager.litellm }}, property: master_key }
---
# spicedb-config in the APP namespace: exact secret name/keys the upstream
# chart suite expects (preshared_key + datastore_uri).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spicedb-config
  namespace: {{ .Values.appNamespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: spicedb-config }
  data:
    - secretKey: preshared_key
      remoteRef: { key: {{ .Values.secretsManager.spicedb }}, property: preshared_key }
    - secretKey: datastore_uri
      remoteRef: { key: {{ .Values.secretsManager.rdsSpicedb }}, property: datastore_uri }
{{- if .Values.secretsManager.valkey }}
---
# docling-rq external Redis URL (ElastiCache Valkey), app namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docling-rq-redis-url
  namespace: {{ .Values.appNamespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: docling-rq-redis-url }
  data:
    - secretKey: uri
      remoteRef: { key: {{ .Values.secretsManager.valkey }}, property: uri }
{{- end }}
{{- range .Values.appSecrets }}
---
# App-namespace secret mapping defined by the umbrella wiring.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Values.appNamespace }}
  labels: {{- include "spark-platform.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $store }} }
  target: { name: {{ .name }} }
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef: { key: {{ .remoteRef.key }}, property: {{ .remoteRef.property }} }
    {{- end }}
{{- end }}
