{{- if .Values.oauth2Proxy.enabled }}
# oauth2-proxy in front of the SPARK Workflow frontend (perimeter login),
# mirroring the upstream compose configuration. Front-channel URLs use the
# public Keycloak host; back-channel (redeem/JWKS/profile) stays in-cluster.
# Disabled by default: Envoy Gateway native OIDC (SecurityPolicy) is the
# primary perimeter — this deployment is the drop-in fallback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "spark-platform.selectorLabels" "oauth2-proxy" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "spark-platform.selectorLabels" "oauth2-proxy" | nindent 8 }}
    spec:
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: 0.0.0.0:4180
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://{{ .Values.oauth2Proxy.upstreamService }}.{{ .Values.appNamespace }}.svc.cluster.local:{{ .Values.oauth2Proxy.upstreamPort }}
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_PROVIDER
              value: keycloak-oidc
            - name: OAUTH2_PROXY_CLIENT_ID
              value: {{ .Values.keycloak.clientId }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: oauth2-proxy, key: cookie-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://{{ .Values.hosts.frontend }}/oauth2/callback
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: S256
            - name: OAUTH2_PROXY_SKIP_OIDC_DISCOVERY
              value: "true"
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://{{ .Values.hosts.keycloak }}/realms/{{ .Values.keycloak.realm }}
            - name: OAUTH2_PROXY_LOGIN_URL
              value: https://{{ .Values.hosts.keycloak }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/auth
            - name: OAUTH2_PROXY_REDEEM_URL
              value: http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/token
            - name: OAUTH2_PROXY_OIDC_JWKS_URL
              value: http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs
            - name: OAUTH2_PROXY_PROFILE_URL
              value: http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/userinfo
            # Forward identity + access token to the app (headers the
            # frontend/backends consume behind the authenticating proxy).
            - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
spec:
  selector: {{- include "spark-platform.selectorLabels" "oauth2-proxy" | nindent 4 }}
  ports:
    - { name: http, port: 4180, targetPort: http }
{{- end }}
