{{- if .Values.dbRoles.enabled }}
# Database roles and the platform layer's databases against RDS, as a
# pre-install job of this release:
#   - dedicated roles (app, temporal, keycloak, spicedb) — the upstream
#     db-init chart (inside the spark-platform umbrella, next release) creates
#     the application's databases but no roles, by design
#   - the databases this layer's own workloads open before the umbrella
#     exists (keycloak, spicedb) and the gesetze-normen database with the
#     upstream seed (the dump carries psql-17 directives that db-init's
#     restore does not strip; the seed is downloaded from S3, uploaded there by
#     terraform from the unmodified upstream submodule)
# Idempotent: roles/databases are created only when absent; the seed is only
# imported into an empty gesetze-normen database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-roles-scripts
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-8"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  init.sh: |
    #!/bin/bash
    set -euo pipefail
    export PGHOST="{{ .Values.rds.host }}"
    export PGPORT="{{ .Values.rds.port }}"
    export PGDATABASE=postgres

    role_exists() { psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='$1'" | grep -q 1; }
    db_exists()   { psql -tAc "SELECT 1 FROM pg_database WHERE datname='$1'" | grep -q 1; }

    echo "==> Creating roles"
    for role in app temporal keycloak spicedb; do
      pw_var="PW_$(echo "$role" | tr '[:lower:]' '[:upper:]')"
      if ! role_exists "spark_${role}"; then
        psql -v ON_ERROR_STOP=1 -c "CREATE ROLE spark_${role} LOGIN PASSWORD '${!pw_var}'"
        echo "    role spark_${role} created"
      fi
    done

    echo "==> Creating the platform layer's databases"
    {{- range .Values.dbRoles.databases }}
    if ! db_exists "{{ .name }}"; then
      psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"{{ .name }}\" OWNER {{ .owner }}"
      echo "    database {{ .name }} created"
    fi
    {{- if .vector }}
    psql -v ON_ERROR_STOP=1 -d "{{ .name }}" -c "CREATE EXTENSION IF NOT EXISTS vector"
    {{- end }}
    {{- end }}

    echo "==> Seeding {{ .Values.dbRoles.seedDatabase }} (skipped when tables already present)"
    tables=$(psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" -d "{{ .Values.dbRoles.seedDatabase }}")
    if [ "${tables}" = "0" ] && [ -f /work/seed.sql.gz ]; then
      # sed mirrors upstream compose: strip pg_dump-17-only statements.
      gunzip -c /work/seed.sql.gz \
        | sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' -e '/^SET transaction_timeout/d' \
        | psql -v ON_ERROR_STOP=1 -d "{{ .Values.dbRoles.seedDatabase }}"
      psql -v ON_ERROR_STOP=1 -d "{{ .Values.dbRoles.seedDatabase }}" \
        -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO spark_app; ALTER DATABASE {{ .Values.dbRoles.seedDatabase | quote }} OWNER TO spark_app"
      echo "    seed imported"
    else
      echo "    seed skipped (tables=${tables})"
    fi
    echo "==> Database roles finished"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-roles
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {{- include "spark-platform.selectorLabels" "db-roles" | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: fetch-seed
          image: {{ .Values.dbRoles.awsCliImage }}
          command: ["/bin/sh", "-c"]
          args:
            - aws s3 cp "s3://{{ .Values.s3.dmsBucket }}/{{ .Values.s3.seedObjectKey }}" /work/seed.sql.gz && ls -la /work
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: s3-app, key: S3_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: s3-app, key: S3_SECRET_ACCESS_KEY } }
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region }}
          volumeMounts:
            - { name: work, mountPath: /work }
      containers:
        - name: db-roles
          image: {{ .Values.dbRoles.image }}
          command: ["/bin/bash", "/scripts/init.sh"]
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: rds-master, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: rds-master, key: password } }
            - name: PW_APP
              valueFrom: { secretKeyRef: { name: db-user-passwords, key: app } }
            - name: PW_TEMPORAL
              valueFrom: { secretKeyRef: { name: db-user-passwords, key: temporal } }
            - name: PW_KEYCLOAK
              valueFrom: { secretKeyRef: { name: db-user-passwords, key: keycloak } }
            - name: PW_SPICEDB
              valueFrom: { secretKeyRef: { name: db-user-passwords, key: spicedb } }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: work, mountPath: /work }
      volumes:
        - name: scripts
          configMap: { name: db-roles-scripts, defaultMode: 0755 }
        - name: work
          emptyDir: {}
---
# Per-role passwords for the job (hooked so it exists before the job).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-user-passwords
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ .Values.clusterSecretStore }} }
  target: { name: db-user-passwords }
  data:
    - secretKey: app
      remoteRef: { key: {{ .Values.secretsManager.rdsApp }}, property: password }
    - secretKey: temporal
      remoteRef: { key: {{ .Values.secretsManager.rdsTemporal }}, property: password }
    - secretKey: keycloak
      remoteRef: { key: {{ .Values.secretsManager.rdsKeycloak }}, property: password }
    - secretKey: spicedb
      remoteRef: { key: {{ .Values.secretsManager.rdsSpicedb }}, property: password }
{{- end }}
