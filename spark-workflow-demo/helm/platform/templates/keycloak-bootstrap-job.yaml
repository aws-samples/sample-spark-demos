# Realm bootstrap, derived from the upstream docker/keycloak/bootstrap.sh
# (realm, confidential client, audience mapper, realm roles, demo user).
# Runs as post-install hook and retries until Keycloak is ready.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-bootstrap
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail
    KCADM=/opt/keycloak/bin/kcadm.sh
    REALM="{{ .Values.keycloak.realm }}"
    CLIENT="{{ .Values.keycloak.clientId }}"
    FRONTEND_URL="https://{{ .Values.hosts.frontend }}"
    TEMPORAL_URL="https://{{ .Values.hosts.temporal }}"

    echo "Waiting for Keycloak ..."
    for i in $(seq 1 60); do
      if "$KCADM" config credentials --server http://keycloak:8080 \
           --realm master --user admin --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; then
        break
      fi
      sleep 10
    done
    "$KCADM" config credentials --server http://keycloak:8080 \
      --realm master --user admin --password "$KC_ADMIN_PASSWORD"

    if ! "$KCADM" get "realms/$REALM" >/dev/null 2>&1; then
      "$KCADM" create realms -s "realm=$REALM" -s enabled=true
    fi
    "$KCADM" update "realms/$REALM" \
      -s enabled=true \
      -s loginWithEmailAllowed=true \
      -s accessTokenLifespan=28800 \
      -s ssoSessionIdleTimeout=86400 \
      -s ssoSessionMaxLifespan=86400

    for role in admin user service; do
      "$KCADM" get "roles/$role" -r "$REALM" >/dev/null 2>&1 || \
        "$KCADM" create roles -r "$REALM" -s "name=$role"
    done

    client_id="$("$KCADM" get clients -r "$REALM" -q "clientId=$CLIENT" --fields id --format csv --noquotes 2>/dev/null | head -n 1)"
    if [ -z "$client_id" ]; then
      "$KCADM" create clients -r "$REALM" \
        -s "clientId=$CLIENT" \
        -s enabled=true \
        -s publicClient=false \
        -s "secret=$KC_CLIENT_SECRET" \
        -s serviceAccountsEnabled=true \
        -s directAccessGrantsEnabled=true \
        -s standardFlowEnabled=true
      client_id="$("$KCADM" get clients -r "$REALM" -q "clientId=$CLIENT" --fields id --format csv --noquotes | head -n 1)"
    fi
    # Each OIDC-protected host runs its own Envoy oauth2 flow, so every
    # host's callback URI must be registered (temporal-ui included).
    REDIRECT_URIS="[\"${FRONTEND_URL}/oauth2/callback\"{{ if .Values.temporalUi.enabled }},\"${TEMPORAL_URL}/oauth2/callback\"{{ end }}]"
    WEB_ORIGINS="[\"${FRONTEND_URL}\"{{ if .Values.temporalUi.enabled }},\"${TEMPORAL_URL}\"{{ end }}]"
    "$KCADM" update "clients/$client_id" -r "$REALM" \
      -s "redirectUris=$REDIRECT_URIS" \
      -s "webOrigins=$WEB_ORIGINS"

    if ! "$KCADM" get "clients/$client_id/protocol-mappers/models" -r "$REALM" --fields name --format csv --noquotes | grep -qx "${CLIENT}-audience"; then
      "$KCADM" create "clients/$client_id/protocol-mappers/models" -r "$REALM" \
        -s "name=${CLIENT}-audience" \
        -s protocol=openid-connect \
        -s protocolMapper=oidc-audience-mapper \
        -s "config.\"included.client.audience\"=$CLIENT" \
        -s 'config."access.token.claim"=true' \
        -s 'config."id.token.claim"=false'
    fi

    "$KCADM" add-roles -r "$REALM" \
      --uusername "service-account-${CLIENT}" \
      --cclientid realm-management \
      --rolename view-users --rolename view-realm --rolename query-users || true

    cat > /tmp/demo-user.json <<JSON
    {
      "users": [
        {
          "id": "{{ .Values.keycloak.demoUser.id }}",
          "username": "${DEMO_USER_EMAIL}",
          "email": "${DEMO_USER_EMAIL}",
          "emailVerified": true,
          "enabled": true,
          "firstName": "{{ .Values.keycloak.demoUser.firstName }}",
          "lastName": "{{ .Values.keycloak.demoUser.lastName }}",
          "credentials": [
            { "type": "password", "value": "${DEMO_USER_PASSWORD}", "temporary": false }
          ],
          "realmRoles": ["admin", "user"]
        }
      ]
    }
    JSON
    "$KCADM" create partialImport -r "$REALM" -s ifResourceExists=SKIP -o -f /tmp/demo-user.json
    rm -f /tmp/demo-user.json
    echo "Keycloak bootstrap finished."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {{- include "spark-platform.selectorLabels" "keycloak-bootstrap" | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.keycloak.image }}
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          env:
            - name: KC_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: admin_password } }
            - name: KC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: client_secret } }
            - name: DEMO_USER_EMAIL
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: demo_user_email } }
            - name: DEMO_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: demo_user_password } }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap: { name: keycloak-bootstrap, defaultMode: 0755 }
