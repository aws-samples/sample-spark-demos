# ExternalSecrets: sync the Secrets Manager entries into K8s secrets for
# the platform namespace and the app namespace (the umbrella's services
# read credentials via secretKeyRef).
{{- $store := .Values.clusterSecretStore }}
{{- $namespaces := list .Release.Namespace .Values.appNamespace | uniq }}
{{- range $ns := $namespaces }}
{{- range $name, $remote := (dict
  "rabbitmq" $.Values.secretsManager.rabbitmq
  "neo4j" $.Values.secretsManager.neo4j
  "litellm" $.Values.secretsManager.litellm
  "bizlog" $.Values.secretsManager.bizlog
  "s3-app" $.Values.secretsManager.s3App) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "spark-api-platform.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ $name }}
  dataFrom:
    - extract:
        key: {{ $remote }}
{{- end }}
---
# rds-app in the app namespace for the services' DB credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-app
  namespace: {{ $ns }}
  labels: {{- include "spark-api-platform.labels" $ | nindent 4 }}
  {{- if eq $ns $.Release.Namespace }}
  # In the platform namespace the db-init pre-install hook consumes this
  # secret, so it must exist BEFORE the hook runs (verified pattern from
  # the spark-workflow demo: hook weight -10 < job weight 0/5).
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: rds-app
  dataFrom:
    - extract:
        key: {{ $.Values.secretsManager.rdsApp }}
{{- end }}
---
{{- if .Values.auth.enabled }}
# Auth perimeter secrets (platform namespace only: consumed by keycloak,
# the bootstrap job and oauth2-proxy).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-credentials
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-api-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore }}
  target:
    name: keycloak-credentials
  dataFrom:
    - extract:
        key: {{ .Values.secretsManager.keycloak }}
---
# oauth2-proxy needs the OIDC client secret (from the keycloak entry) and
# its cookie secret (own entry) under the key names the deployment expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-api-platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore }}
  target:
    name: oauth2-proxy
  data:
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.secretsManager.keycloak }}
        property: client_secret
    # checkov:skip=CKV_SECRET_6: Kubernetes secret KEY name + Secrets Manager reference, not a value
    - secretKey: cookie-secret
      remoteRef:
        key: {{ .Values.secretsManager.oauth2Proxy }}
        property: cookie_secret
---
{{- end }}
# The RDS master secret is only needed by the db-init job (platform ns).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-master
  namespace: {{ .Release.Namespace }}
  labels: {{- include "spark-api-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore }}
  target:
    name: rds-master
  dataFrom:
    - extract:
        key: {{ .Values.secretsManager.rdsMaster }}
